# arch-server over Tailscale (needs this machine on the tailnet: sudo tailscale up, once).
# The server's `tailscale serve` forwards port 22 to its loopback sshd, so login is key-only as before.
Host arch-server
  HostName 100.79.136.93
  User gavin
  HostKeyAlias arch-server
  UserKnownHostsFile ~/.ssh/known_hosts ~/.ssh/known_hosts.d/arch-server
