# Use AMD's own X driver with TearFree instead of modesetting: TearFree page-flips every
# update, so the laptop panel always picks up new frames. Under modesetting the screen
# stayed on an old frame (bar clock and tags frozen) until the next display commit.
Section "OutputClass"
	Identifier "AMDgpu"
	MatchDriver "amdgpu"
	Driver "amdgpu"
	Option "TearFree" "true"
EndSection
